name: Quantum Forge Android APK
on:
  push:
    branches:
      - quantum-forge-game
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Android project
        run: |
          mkdir -p qfgame
          echo '' | base64 -d | tar -xz -C qfgame
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: cd qfgame && gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QuantumForge-APK
          path: qfgame/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
